<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        color: white;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
          sans-serif;
      }
      .grid1 {
        background-color: rgb(52, 49, 49);
        display: grid;
        grid-template-columns: 150px auto;
        border: 2px black solid;
        border-radius: 10px;
        width: 42vw;
        padding-top: 10px;
        margin: 10px;
        height: 80px;
      }
      .grid2 {
        display: grid;
        grid-template-rows: 30px 10px;
        font-size: 17px;
        width: 100%;
      }
      .heading {
        max-width: 100%;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .grid3 {
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap; /* helps on smaller screens */
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="cont">
      <div class="grid1">
      <img
        style="border-radius: 10px; width: 140px; height: auto"
        src="harry.avif"
        alt=""
      />
      <div class="grid2">
        <div class="heading">
          How to make a card for Youtube video using Html & CSS
        </div>
        <div class="grid3">
          <div class="channel">tokyoghouldb</div>
          <div class="views">460K</div>
          <div class="time">22yr</div>
        </div>
      </div>
    </div>
    </div>
    <script src="script2.js"></script>
  </body>
</html>
